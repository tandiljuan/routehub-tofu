#cloud-config

write_files:

  - path: /usr/local/sbin/gateway-bootstrap.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash

      # ============================================================================
      # NAT Gateway and Firewall Bootstrap
      # ============================================================================
      #
      # - Enable IPv4 forwarding
      # - Configure NAT for the private network
      # - Apply a deterministic and idempotent firewall state
      #
      # ============================================================================

      set -euo pipefail

      # ============================================================================
      # DETECT PUBLIC INTERFACE
      # ============================================================================

      PUBLIC_IF=$(ip route show default | awk '/^default/ {print $5; exit}')

      if [[ -z "${PUBLIC_IF:-}" ]]; then
        echo "ERROR: Failed to detect public interface" >&2
        exit 1
      fi

      # ============================================================================
      # DETECT PRIVATE INTERFACE
      # ============================================================================

      PRIVATE_IF=$(ip -o -4 addr show | awk '$4 ~ /^(10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|192\.168\.)/ {print $2; exit}')

      if [[ -z "${PRIVATE_IF:-}" ]]; then
        echo "ERROR: Failed to detect private interface" >&2
        exit 1
      fi

      # ============================================================================
      # VALIDATION
      # ============================================================================

      if [[ "$PUBLIC_IF" == "$PRIVATE_IF" ]]; then
        echo "ERROR: Public and private interfaces are identical" >&2
        exit 1
      fi

      # ============================================================================
      # SHOW DETECTED CONFIGURATION
      # ============================================================================

      echo "PUBLIC_IF=$PUBLIC_IF"
      echo "PRIVATE_IF=$PRIVATE_IF"

      # ============================================================================
      # SYSCTL
      # ============================================================================

      declare -A SYSCTL_RULES=(
        ["net.ipv4.ip_forward"]="1"
        ["net.ipv4.conf.all.rp_filter"]="2"
        ["net.ipv4.conf.default.rp_filter"]="2"
        ["net.ipv4.conf.all.src_valid_mark"]="1"
      )

      SYSCTL_PATH="/etc/sysctl.d"
      SYSCTL_FILE="99-gateway.conf"

      mkdir -p "${SYSCTL_PATH}"
      : > "${SYSCTL_PATH}/${SYSCTL_FILE}"

      for key in "${!SYSCTL_RULES[@]}"; do
        echo "${key}=${SYSCTL_RULES[$key]}" >> "${SYSCTL_PATH}/${SYSCTL_FILE}"
      done

      sysctl --system >/dev/null

      # ============================================================================
      # IPTABLES POLICIES
      # ============================================================================

      iptables -P INPUT DROP
      iptables -P FORWARD DROP
      iptables -P OUTPUT ACCEPT

      # ============================================================================
      # ENSURE JUMP RULES ARE UNIQUE
      # ============================================================================

      iptables -C INPUT -j GW-INPUT 2>/dev/null && \
      iptables -D INPUT -j GW-INPUT

      iptables -C FORWARD -j GW-FWD 2>/dev/null && \
      iptables -D FORWARD -j GW-FWD

      iptables -C POSTROUTING -t nat -j GW-NAT 2>/dev/null && \
      iptables -D POSTROUTING -t nat -j GW-NAT

      # ============================================================================
      # IPTABLES RULES
      # ============================================================================

      iptables-restore --noflush <<EOF

      # ============================================================================
      # FILTER TABLE
      # ============================================================================

      *filter

      # Create custom chains
      :GW-INPUT - [0:0]
      :GW-FWD - [0:0]

      # Flush chains for idempotency
      -F GW-INPUT
      -F GW-FWD

      # Attach chains
      -A INPUT -j GW-INPUT
      -A FORWARD -j GW-FWD

      # --------------------------------------------------------------------------
      # INPUT CHAIN
      # --------------------------------------------------------------------------

      # Drop invalid packets
      -A GW-INPUT \
        -m conntrack --ctstate INVALID \
        -j DROP

      # Allow loopback
      -A GW-INPUT \
        -i lo \
        -j ACCEPT

      # Trust internal network completely
      -A GW-INPUT \
        -i $PRIVATE_IF \
        -j ACCEPT

      # Allow ICMP
      -A GW-INPUT \
        -p icmp \
        -j ACCEPT

      # Allow return packets for established Internet connections.
      -A GW-INPUT \
        -m conntrack --ctstate ESTABLISHED,RELATED \
        -j ACCEPT

      # Allow SSH from public Internet
      # @TODO: Filter by IPs
      -A GW-INPUT \
        -i $PUBLIC_IF \
        -p tcp \
        --dport 22 \
        -m conntrack --ctstate NEW \
        -j ACCEPT

      # --------------------------------------------------------------------------
      # FORWARD CHAIN
      # --------------------------------------------------------------------------

      # Drop invalid packets
      -A GW-FWD \
        -m conntrack --ctstate INVALID \
        -j DROP

      # Allow ICMP
      -A GW-FWD \
        -p icmp \
        -j ACCEPT

      # Allow return packets for established Internet connections.
      -A GW-FWD \
        -i $PUBLIC_IF \
        -o $PRIVATE_IF \
        -m conntrack --ctstate ESTABLISHED,RELATED \
        -j ACCEPT

      # Allow "Private -> Internet"
      -A GW-FWD \
        -i $PRIVATE_IF \
        -o $PUBLIC_IF \
        -m conntrack --ctstate NEW,ESTABLISHED,RELATED \
        -j ACCEPT

      COMMIT

      # ============================================================================
      # NAT TABLE
      # ============================================================================

      *nat

      # Create custom chain
      :GW-NAT - [0:0]

      # Flush chain for idempotency
      -F GW-NAT

      # Attach chain
      -A POSTROUTING -j GW-NAT

      # NAT traffic "Private Subnet -> Internet"
      #
      # MASQUERADE rewrites packets leaving the public interface
      # so they appear to come from the gateway server's public IP.
      #
      # This allows machines on the private network to access
      # the Internet even though they do not have public IP addresses.
      -A GW-NAT \
        -o $PUBLIC_IF \
        -j MASQUERADE

      COMMIT
      EOF

      echo "Firewall and NAT rules applied successfully."

  - path: /etc/systemd/system/gateway-bootstrap.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Configure NAT gateway and firewall rules for private network
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/gateway-bootstrap.sh
      ExecReload=/usr/local/sbin/gateway-bootstrap.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/resolved.conf
    content: |

      DNS=185.12.64.1 1.1.1.1
      FallbackDNS=8.8.8.8 9.9.9.9 208.67.222.222
    append: true

runcmd:

  - systemctl daemon-reload
  - systemctl enable gateway-bootstrap.service
  - systemctl start gateway-bootstrap.service
  - systemctl restart systemd-resolved
